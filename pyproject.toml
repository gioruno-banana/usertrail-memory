[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usertrail-development"
version = "0.1.1"
description = "User history development package; frozen Full sources are separate"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
packages = ["usertrail", "coordination"]
py-modules = ["usertrail_service"]
package-dir = {"" = "interfaces/http", "usertrail" = "history/usertrail", "coordination" = "coordination"}
